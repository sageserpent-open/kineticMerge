name: Release

on:
  workflow_dispatch:

jobs:
  # release:
  # uses: guardian/gha-scala-library-release-workflow/.github/workflows/reusable-release.yml@v1
  # permissions: { contents: write, pull-requests: write }
  # secrets:
  # SONATYPE_TOKEN: ${{ secrets.AUTOMATED_MAVEN_RELEASE_SONATYPE_TOKEN }}
  # PGP_PRIVATE_KEY: ${{ secrets.AUTOMATED_MAVEN_RELEASE_PGP_SECRET }}
  # GITHUB_APP_PRIVATE_KEY: ${{ secrets.AUTOMATED_MAVEN_RELEASE_GITHUB_APP_PRIVATE_KEY }}
  # with:
  # GITHUB_APP_ID: 983631
  # SONATYPE_PROFILE_NAME: "com.sageserpent"
  # SONATYPE_CREDENTIAL_HOST: "central.sonatype.com"

  assemble-applications:
    runs-on: ${{ matrix.os }}
    # needs: release
    strategy:
      matrix:
        # Cross-compiling for Windows, Linux, and modern/Intel Mac frameworks
        os: [ windows-latest, macos-15-intel, macos-15, ubuntu-latest ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "main" # TODO: "v${{ needs.release.outputs.RELEASE_VERSION }}"

      - name: Set up JDK.
        uses: actions/setup-java@v5
        with:
          java-version: 17 # TODO: suppose I want to compile against JDK 17 but bundle the JDK 26 JVM?
          distribution: corretto

      - uses: sbt/setup-sbt@v1

      - name: Stage application JAR files for JReleaser.
        run: |
          sbt "gitCliApplication/stagedJarsForJReleaserDirectory"
          sbt "toolCliApplication/stagedJarsForJReleaserDirectory"

      - name: Assemble platform-specific application.
        uses: jreleaser/release-action@v2
        with:
          arguments: assemble
        env:
          JRELEASER_PROJECT_VERSION: 1.21.6 # TODO: this is jemmied: should use `${{ needs.release.outputs.RELEASE_VERSION }}`.

      - name: Upload assembled applications to cache.
        uses: actions/upload-artifact@v4
        with:
          name: jlink-packages
          path: out/jreleaser/assemble/

  uploadExecutables:
    needs: assemble-applications
    runs-on: ubuntu-latest

    steps:
      - id: generate-github-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: 983631
          private-key: ${{ secrets.AUTOMATED_MAVEN_RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "main"

      - name: Set up JDK.
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: corretto

      - name: Download assembled applications from cache.
        uses: actions/download-artifact@v4
        with:
          path: .
          name: jlink-packages

      - name: Add executables to release, package and publish to distribution channels such as Brew and Scoop.
        uses: jreleaser/release-action@v2
        with:
          arguments: full-release
        env:
          JRELEASER_PROJECT_VERSION: 1.21.6
          JRELEASER_GITHUB_TOKEN: ${{ steps.generate-github-app-token.outputs.token }}
