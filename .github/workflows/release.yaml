name: Release

on:
  workflow_dispatch:

jobs:
  #  release:
  #    uses: guardian/gha-scala-library-release-workflow/.github/workflows/reusable-release.yml@v2
  #    permissions: { contents: write, pull-requests: write }
  #    secrets:
  #      SONATYPE_TOKEN: ${{ secrets.AUTOMATED_MAVEN_RELEASE_SONATYPE_TOKEN }}
  #      PGP_PRIVATE_KEY: ${{ secrets.AUTOMATED_MAVEN_RELEASE_PGP_SECRET }}
  #      GITHUB_APP_PRIVATE_KEY: ${{ secrets.AUTOMATED_MAVEN_RELEASE_GITHUB_APP_PRIVATE_KEY }}
  #    with:
  #      GITHUB_APP_ID: 983631

  assemble-applications:
    #    needs: release
    strategy:
      matrix:
        # Cross-compiling for Windows, Linux, and modern/Intel Mac frameworks
        os: [ windows-latest, macos-15-intel, macos-15, ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "v1.22.2" # TODO: this has been jemmied!

      - name: Set up JDK for compilation.
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: corretto

      - uses: sbt/setup-sbt@v1

      - name: Stage application JAR files for JReleaser.
        run: |
          sbt "gitCliApplication/stagedJarsForJReleaserDirectory"
          sbt "toolCliApplication/stagedJarsForJReleaserDirectory"

      - name: Set up JDK for JLink assembly.
        uses: actions/setup-java@v5
        with:
          java-version: 26 # Use the latest JDK supported across the matrix, as JLink bundles a private reduced JVM into the application package.
          distribution: corretto

      - name: Assemble platform-specific application.
        uses: jreleaser/release-action@v2
        with:
          setup-java: false
          arguments: assemble
        env:
          JRELEASER_PROJECT_VERSION: "1.22.2" # TODO: this has been jemmied!

      - name: Upload assembled applications to cache.
        uses: actions/upload-artifact@v7
        with:
          name: jlink-packages-${{ matrix.os }}
          path: out/jreleaser/assemble/

  uploadExecutables:
    needs:
      #      - release
      - assemble-applications
    runs-on: ubuntu-latest

    steps:
      - id: generate-github-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: 983631
          private-key: ${{ secrets.AUTOMATED_MAVEN_RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "v1.22.2" # TODO: this has been jemmied!
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: corretto

      - name: Download assembled applications from cache.
        uses: actions/download-artifact@v8
        with:
          pattern: jlink-packages-*
          path: out/jreleaser/assemble
          merge-multiple: true

      - name: Add executables to release, package and publish to distribution channels such as Brew and Scoop.
        uses: jreleaser/release-action@v2
        with:
          setup-java: false
          arguments: full-release
        env:
          JRELEASER_PROJECT_VERSION: "1.22.2" # TODO: this has been jemmied!
          JRELEASER_GITHUB_TOKEN: ${{ steps.generate-github-app-token.outputs.token }}
