name: Release

on:
  workflow_dispatch:

jobs:
  release:
    uses: guardian/gha-scala-library-release-workflow/.github/workflows/reusable-release.yml@v1
    permissions: { contents: write, pull-requests: write }
    secrets:
      SONATYPE_TOKEN: ${{ secrets.AUTOMATED_MAVEN_RELEASE_SONATYPE_TOKEN }}
      PGP_PRIVATE_KEY: ${{ secrets.AUTOMATED_MAVEN_RELEASE_PGP_SECRET }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.AUTOMATED_MAVEN_RELEASE_GITHUB_APP_PRIVATE_KEY }}
    with:
      GITHUB_APP_ID: 983631
      SONATYPE_PROFILE_NAME: "com.sageserpent"
      SONATYPE_CREDENTIAL_HOST: "central.sonatype.com"

  uploadExecutables:
    runs-on: ubuntu-latest
    needs: release

    steps:
      - id: generate-github-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: 983631
          private-key: ${{ secrets.AUTOMATED_MAVEN_RELEASE_GITHUB_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "v${{ needs.release.outputs.RELEASE_VERSION }}"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: corretto
      - uses: sbt/setup-sbt@v1
      - name: Add executables to release
        env:
          GH_TOKEN: ${{ steps.generate-github-app-token.outputs.token }}
        run: |
          sbt "gitCliApplication/packageExecutable"
          sbt "toolCliApplication/packageExecutable"
          gh release upload "v${{ needs.release.outputs.RELEASE_VERSION }}" "${GITHUB_WORKSPACE}/git-cli-application/target/kinetic-merge" "${GITHUB_WORKSPACE}/git-cli-application/target/kinetic-merge.bat" "${GITHUB_WORKSPACE}/tool-cli-application/target/kinetic-merge-tool" "${GITHUB_WORKSPACE}/tool-cli-application/target/kinetic-merge-tool.bat"
      - name: Publish the executables via JReleaser
        uses: jreleaser/release-action@v2
        with:
          arguments: publish
        env:
          JRELEASER_GITHUB_TOKEN: ${{ steps.generate-github-app-token.outputs.token }}
          JRELEASER_HOMEBREW_GITHUB_TOKEN: ${{ steps.generate-github-app-token.outputs.token }}
          JRELEASER_SCOOP_GITHUB_TOKEN: ${{ steps.generate-github-app-token.outputs.token }}
          JRELEASER_PROJECT_VERSION: ${{ needs.release.outputs.RELEASE_VERSION }}
